name: Banger
options:
  bundleIdPrefix: com.bangerwidget
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  BangerKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/BangerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bangerwidget.BangerKit
        INFOPLIST_FILE: Sources/BangerKit/Info.plist
        SKIP_INSTALL: "NO"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  Banger:
    type: application
    platform: macOS
    sources:
      - path: Sources/Banger
      - path: Resources
        buildPhase: resources
        optional: true
    dependencies:
      - target: BangerKit
        embed: true
      - target: BangerWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bangerwidget.Banger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Banger/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Banger/Banger.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: "NO"
    postBuildScripts:
      - name: Strip extended attributes before code signing
        # macOS 26 stamps com.apple.provenance on files in the project directory, and it
        # rides along into the built bundle. codesign then refuses with "resource fork,
        # Finder information, or similar detritus not allowed". Clearing it here runs
        # before the automatic CodeSign phase.
        script: |
          /usr/bin/xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
        basedOnDependencyAnalysis: false

  BangerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BangerWidget
    dependencies:
      - target: BangerKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bangerwidget.Banger.BangerWidget
        INFOPLIST_FILE: Sources/BangerWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/BangerWidget/BangerWidget.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
        SKIP_INSTALL: "YES"
        # Mandatory: the widget host will not load an unsandboxed extension.
        ENABLE_APP_SANDBOX: "YES"
    postBuildScripts:
      - name: Strip extended attributes before code signing
        # macOS 26 stamps com.apple.provenance on files in the project directory, and it
        # rides along into the built bundle. codesign then refuses with "resource fork,
        # Finder information, or similar detritus not allowed". Clearing it here runs
        # before the automatic CodeSign phase.
        script: |
          /usr/bin/xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
        basedOnDependencyAnalysis: false

  bangerctl:
    type: tool
    platform: macOS
    sources:
      - path: Sources/bangerctl
      - path: Sources/BangerKit
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bangerwidget.bangerctl
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "CLI_TOOL"

  bangerrender:
    type: tool
    platform: macOS
    sources:
      - path: Sources/bangerrender
      - path: Sources/BangerKit
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bangerwidget.bangerrender
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "CLI_TOOL"
